<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード判定＆リーダーアプリ</title>
    <!-- html5-qrcode ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f4f4f9;
            margin: 0;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            text-align: left;
        }
        .hidden {
            display: none !important;
        }
        /* ボタンスタイル */
        .btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-green { background-color: #4caf50; }
        .btn-orange { background-color: #ff9800; }
        .btn-red { background-color: #f44336; }
        .btn:active { opacity: 0.8; }

        /* 入力フォーム */
        .form-group {
            margin-bottom: 12px;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .del-btn {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 保存中リストのカード */
        .saved-item-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .saved-info {
            flex: 1;
            cursor: pointer;
        }
        .saved-title {
            font-weight: bold;
            color: #0d47a1;
            font-size: 15px;
        }
        .saved-desc {
            font-size: 12px;
            color: #666;
        }

        /* カメラと結果 */
        #reader {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #result {
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
        }
        .success { color: #1b5e20; background-color: #e8f5e9; border: 1px solid #c8e6c9; }
        .error { color: #b71c1c; background-color: #ffebee; border: 1px solid #ffcdd2; }
        .neutral { color: #333; background-color: #f9f9f9; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="container">

        <!-- ================= メイン画面 ================= -->
        <div id="view-home" class="card" style="text-align: center;">
            <h1>QRコードリーダーアプリ</h1>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">モードを選んでください</p>
            <button class="btn" onclick="startNormalReader()">📷 通常のQR読み取り</button>
            <button class="btn btn-green" onclick="showCreateView()">✨ 判定モード（新規作成）</button>
            <button class="btn btn-orange" onclick="showSavedList()">📂 保存中から選んで開始</button>
        </div>

        <!-- ================= カメラ実行画面（通常・判定兼用） ================= -->
        <div id="view-camera" class="card hidden" style="text-align: center;">
            <h1 id="camera-title">QR読み取り中</h1>
            <div id="reader"></div>
            <div id="result" class="neutral">QRコードをかざしてください</div>
            <button class="btn btn-red" onclick="stopCameraAndGoHome()">🏠 メニューに戻る</button>
        </div>

        <!-- ================= 新規作成・編集画面 ================= -->
        <div id="view-form" class="card hidden">
            <h1 id="form-heading">✨ 正解セットの作成</h1>
            
            <div class="form-group">
                <label>タイトル（空欄なら自動で「セット #X」になります）</label>
                <input type="text" id="input-title" placeholder="例: クイズの答え">
            </div>

            <div class="form-group">
                <label>正解の文字（どれか1つ合っていれば正解）</label>
                <div id="inputs-container"></div>
            </div>

            <button class="btn btn-green" onclick="addInputRow()" style="margin-bottom: 10px;">＋ 入力欄を追加</button>
            <button class="btn" onclick="saveSetData()">💾 保存する</button>
            <button class="btn btn-red" onclick="showHome()">🔙 メニューに戻る</button>
        </div>

        <!-- ================= 保存中リスト画面 ================= -->
        <div id="view-saved" class="card hidden">
            <h1>📂 保存中一覧</h1>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">タップするとカメラが起動、右のボタンで編集・削除</p>
            
            <div id="saved-list-container" style="max-height: 250px; overflow-y: auto; margin-bottom: 10px;"></div>
            
            <button class="btn btn-red" onclick="showHome()">🔙 メニューに戻る</button>
        </div>

    </div>

    <script>
        let html5QrCode = null;
        let scanCooldown = false;
        let activeTargets = [];
        let editingIndex = null; // 編集中のインデックス（nullなら新規）

        // 画面を切り替える超シンプル関数
        function switchView(viewId) {
            ['view-home', 'view-camera', 'view-form', 'view-saved'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId !== 'view-camera') {
                stopCamera();
            }
        }

        function showHome() {
            switchView('view-home');
        }

        // ================= データ管理 =================
        function getSets() {
            try {
                const data = localStorage.getItem('qr_simple_sets');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveSets(sets) {
            localStorage.setItem('qr_simple_sets', JSON.stringify(sets));
        }

        // ================= サウンド (Web Audio API) =================
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            if (type === 'success') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.setValueAtTime(f, now + i * 0.06);
                    gain.gain.setValueAtTime(0.15, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.2);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.25);
                });
            } else {
                [880, 698.46].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                    gain.gain.setValueAtTime(0.1, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.15);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.18);
                });
            }
        }

        // ================= 入力フォーム操作 =================
        function showCreateView(editData = null, index = null) {
            editingIndex = index;
            document.getElementById('form-heading').innerText = editData ? "✏️ セットの編集" : "✨ 正解セットの作成";
            document.getElementById('input-title').value = editData ? editData.title : '';
            
            const container = document.getElementById('inputs-container');
            container.innerHTML = '';
            
            if (editData && editData.items) {
                editData.items.forEach(val => addInputRow(val));
            } else {
                addInputRow();
                addInputRow();
            }
            switchView('view-form');
        }

        function addInputRow(val = "") {
            const container = document.getElementById('inputs-container');
            const row = document.createElement('div');
            row.className = 'input-row';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '文字を入力';
            input.value = val;

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'del-btn';
            del.innerText = '×';
            del.onclick = () => container.removeChild(row);

            row.appendChild(input);
            row.appendChild(del);
            container.appendChild(row);
        }

        function saveSetData() {
            const titleInput = document.getElementById('input-title').value.trim();
            const inputs = document.querySelectorAll('#inputs-container input');
            let items = [];
            inputs.forEach(inp => {
                if (inp.value.trim()) items.push(inp.value.trim());
            });

            if (items.length === 0) {
                alert("正解の文字を1つ以上入力してください！");
                return;
            }

            let sets = getSets();
            let title = titleInput;

            if (editingIndex !== null) {
                if (!title) title = sets[editingIndex].title;
                sets[editingIndex] = { title, items };
            } else {
                if (!title) title = `セット #${sets.length + 1}`;
                sets.push({ title, items });
            }

            saveSets(sets);
            alert("保存しました！");
            showSavedList();
        }

        // ================= 保存中リスト表示 =================
        function showSavedList() {
            const container = document.getElementById('saved-list-container');
            const sets = getSets();

            if (sets.length === 0) {
                container.innerHTML = '<p style="font-size:13px; color:#888; text-align:center;">保存されたセットはありません</p>';
                switchView('view-saved');
                return;
            }

            container.innerHTML = '';
            sets.forEach((set, idx) => {
                const box = document.createElement('div');
                box.className = 'saved-item-box';

                const info = document.createElement('div');
                info.className = 'saved-info';
                info.innerHTML = `<div class="saved-title">${set.title}</div><div class="saved-desc">正解: ${set.items.join(', ')}</div>`;
                info.onclick = () => startJudgeReader(set.items, set.title);

                // 編集ボタン
                const editBtn = document.createElement('button');
                editBtn.className = 'del-btn';
                editBtn.style.backgroundColor = '#2196F3';
                editBtn.style.marginRight = '4px';
                editBtn.innerText = '✏️';
                editBtn.onclick = (e) => { e.stopPropagation(); showCreateView(set, idx); };

                // 削除ボタン
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerText = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`「${set.title}」を削除しますか？`)) {
                        sets.splice(idx, 1);
                        saveSets(sets);
                        showSavedList();
                    }
                };

                box.appendChild(info);
                box.appendChild(editBtn);
                box.appendChild(delBtn);
                container.appendChild(box);
            });

            switchView('view-saved');
        }

        // ================= カメラ機能 =================
        function startNormalReader() {
            document.getElementById('camera-title').innerText = "通常のQR読み取り";
            activeTargets = null;
            switchView('view-camera');
            initCamera(null);
        }

        function startJudgeReader(targets, title) {
            document.getElementById('camera-title').innerText = `🎯 判定中: ${title}`;
            activeTargets = targets;
            switchView('view-camera');
            initCamera(targets);
        }

        function initCamera(targets) {
            const resDiv = document.getElementById('result');
            resDiv.className = "neutral";
            resDiv.innerText = "QRコードをかざしてください";

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (text) => {
                    if (scanCooldown) return;

                    if (targets) {
                        // 判定モード
                        if (targets.includes(text)) {
                            playSound('success');
                            resDiv.className = "result success";
                            resDiv.innerHTML = `🎉 【正解！】<br>${text}`;
                        } else {
                            playSound('error');
                            resDiv.className = "result error";
                            resDiv.innerHTML = `🚨 【ピーピー！】違う文字です<br>${text}`;
                        }
                    } else {
                        // 通常モード
                        playSound('success');
                        resDiv.className = "result neutral";
                        resDiv.innerHTML = `読み取り結果: <a href="${text.startsWith('http') ? text : '#'}" target="_blank">${text}</a>`;
                    }

                    scanCooldown = true;
                    setTimeout(() => { scanCooldown = false; }, 1800);
                }
            ).catch(err => {
                resDiv.innerText = "カメラの起動に失敗しました（権限を確認してください）";
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().catch(() => {});
                html5QrCode = null;
            }
        }

        function stopCameraAndGoHome() {
            stopCamera();
            showHome();
        }
    </script>
</body>
</html>
